<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Ballari — Transport</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .near-panel {
      padding: 0.8rem 1rem; border-bottom: 1px solid #334155;
    }
    .near-btn {
      width: 100%; background: #38bdf8; color: #0f172a; border: none;
      padding: 0.5rem; border-radius: 8px; font-size: 0.82rem;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .near-btn:hover { background: #0ea5e9; }
    .near-btn:disabled { background: #334155; color: #64748b; cursor: default; }
    .near-note { font-size: 0.7rem; color: #64748b; margin-top: 0.4rem; }
    .near-row {
      display: flex; align-items: center; gap: 0.5rem;
      background: #0f172a; border: 1px solid #334155; border-radius: 8px;
      padding: 0.45rem 0.6rem; margin-top: 0.4rem; cursor: pointer;
    }
    .near-row:hover { border-color: #38bdf8; }
    .near-badge {
      min-width: 34px; text-align: center; border-radius: 6px;
      padding: 0.1rem 0.3rem; font-size: 0.72rem; font-weight: 700;
      color: #0f172a;
    }
    .near-main { flex: 1; min-width: 0; }
    .near-route { font-size: 0.8rem; color: #f1f5f9; }
    .near-stop  { font-size: 0.68rem; color: #64748b;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .near-eta   { font-size: 0.82rem; font-weight: 700; color: #38bdf8; text-align: right; }
    .near-dist  { font-size: 0.66rem; color: #64748b; text-align: right; }
    .transport-layout {
      display: flex;
      height: calc(100vh - 60px);
    }

    /* Sidebar */
    .route-sidebar {
      width: 320px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 1.2rem;
      border-bottom: 1px solid #334155;
    }
    .sidebar-header h3 {
      color: #38bdf8;
      margin-bottom: 0.8rem;
    }
    .sidebar-search input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      font-size: 0.88rem;
      box-sizing: border-box;
    }

    .route-list {
      overflow-y: auto;
      flex: 1;
      padding: 0.8rem;
    }

    .route-card {
      background: #0f172a;
      border-radius: 10px;
      padding: 0.9rem 1rem;
      margin-bottom: 0.6rem;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }
    .route-card:hover { border-color: #334155; }
    .route-card.active { border-color: var(--route-color, #38bdf8); }

    .route-number {
      font-size: 0.75rem;
      font-weight: bold;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.4rem;
      display: inline-block;
      color: #0f172a;
    }
    .route-name  { font-size: 0.9rem; font-weight: 600; }
    .route-meta  {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 0.3rem;
    }
    .route-freq  {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 0.2rem;
    }

    /* Stop list panel */
    .stop-panel {
      display: none;
      padding: 1rem;
      background: #0f172a;
      border-top: 1px solid #334155;
      max-height: 260px;
      overflow-y: auto;
    }
    .stop-panel.open { display: block; }
    .stop-panel h4 {
      color: #38bdf8;
      font-size: 0.85rem;
      margin-bottom: 0.8rem;
    }

    .stop-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid #1e293b;
      font-size: 0.82rem;
    }
    .stop-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .stop-eta {
      margin-left: auto;
      color: #f59e0b;
      font-size: 0.78rem;
      font-weight: bold;
    }

    /* Map */
    #transport-map {
      flex: 1;
      z-index: 0;
    }

    /* ETA badge on map */
    .eta-badge {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      padding: 0.3rem 0.6rem;
      font-size: 0.75rem;
      color: #38bdf8;
      font-weight: bold;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <nav id="navbar"></nav>

  <div class="transport-layout">

    <!-- Sidebar -->
    <div class="route-sidebar">
      <div class="sidebar-header">
        <h3>🚍 Bus Routes</h3>
        <div class="sidebar-search">
          <input type="text" id="route-search"
            placeholder="🔍 Search route or stop..."
            oninput="filterRoutes()" />
        </div>
      </div>

      <!-- Buses near me: /api/transport/eta -->
      <div class="near-panel" id="near-panel">
        <button class="near-btn" id="near-btn" onclick="findBusesNearMe()">
          📍 Buses near me
        </button>
        <div class="near-note" id="near-note">
          Uses your location to rank buses by how far away they are.
        </div>
        <div id="near-list"></div>
      </div>

      <div class="route-list" id="route-list">
        <p style="color:#64748b; font-size:0.85rem; padding:1rem;">
          Loading routes...
        </p>
      </div>

      <!-- Stop list -->
      <div class="stop-panel" id="stop-panel">
        <h4 id="stop-panel-title">Stops</h4>
        <div id="stop-list"></div>
      </div>
    </div>

    <!-- Map -->
    <div id="transport-map"></div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/transport.js"></script>
</body>
</html>
