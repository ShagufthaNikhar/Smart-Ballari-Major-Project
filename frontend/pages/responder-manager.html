<!DOCTYPE html>
<!-- =================================================================
     SAVE THIS AS:   frontend/pages/responder-manager.html
     ================================================================= -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Ballari — Responder Manager</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .rm-main { max-width: 1200px; margin: 0 auto; padding: 2rem; }

    .rm-head {
      display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 0.8rem;
      margin-bottom: 1.5rem;
    }
    .role-pill {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.35rem 0.9rem; border-radius: 999px;
      background: #38bdf811; border: 1px solid #38bdf8;
      color: #38bdf8; font-size: 0.8rem; font-weight: 600;
    }
    .rm-who { color: #64748b; font-size: 0.8rem; margin-top: 0.3rem; }

    .add-btn {
      padding: 0.55rem 1.1rem; border-radius: 8px; border: none;
      background: #22c55e; color: #0f172a; font-weight: bold; cursor: pointer;
      font-size: 0.85rem;
    }

    .stats-row { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }

    /* ── RECENT INCIDENTS ── */
    .incidents-panel {
      background: #1e293b; border-radius: 12px; border: 1px solid #334155;
      margin-bottom: 1.5rem; overflow: hidden;
    }
    .incidents-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.9rem 1.1rem; background: #0f172a; border-bottom: 1px solid #334155;
    }
    .incidents-head h3 { color: #38bdf8; font-size: 0.95rem; }
    .inc-refresh-btn {
      background: none; border: none; color: #38bdf8; cursor: pointer; font-size: 0.8rem;
    }
    #incidents-list { max-height: 420px; overflow-y: auto; padding: 0.8rem; }
    .inc-card {
      background: #0f172a; border-radius: 10px; border-left: 3px solid #334155;
      padding: 0.8rem 1rem; margin-bottom: 0.6rem; cursor: pointer;
    }
    .inc-card.sev-critical { border-left-color: #7c3aed; }
    .inc-card.sev-high     { border-left-color: #ef4444; }
    .inc-card.sev-medium   { border-left-color: #f59e0b; }
    .inc-card.sev-low      { border-left-color: #22c55e; }
    .inc-card-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.3rem; font-size: 0.82rem;
    }
    .inc-card-type { font-weight: 700; text-transform: uppercase; color: #f1f5f9; }
    .inc-card-sev {
      font-size: 0.68rem; padding: 0.15rem 0.5rem; border-radius: 999px; font-weight: bold;
    }
    .sev-critical .inc-card-sev { background: #7c3aed22; color: #a78bfa; }
    .sev-high     .inc-card-sev { background: #ef444422; color: #ef4444; }
    .sev-medium   .inc-card-sev { background: #f59e0b22; color: #f59e0b; }
    .sev-low      .inc-card-sev { background: #22c55e22; color: #22c55e; }
    .inc-card-desc { color: #cbd5e1; font-size: 0.82rem; margin-bottom: 0.3rem; }
    .inc-card-meta { color: #64748b; font-size: 0.74rem; }
    .inc-outcome {
      margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid #1e293b;
      font-size: 0.78rem; font-weight: 600;
    }
    .inc-outcome.dispatched { color: #22c55e; }
    .inc-outcome.pending    { color: #f59e0b; }
    .inc-outcome.pharmacy   { color: #38bdf8; }
    .inc-outcome.none       { color: #64748b; }
    .inc-detail {
      display: none; margin-top: 0.7rem; padding-top: 0.7rem;
      border-top: 1px solid #334155; font-size: 0.78rem;
    }
    .inc-detail.open { display: block; }
    .inc-detail-row {
      background: #1e293b; border-radius: 8px; padding: 0.5rem 0.7rem; margin-bottom: 0.4rem;
    }
    .inc-detail-label { color: #64748b; font-size: 0.68rem; text-transform: uppercase; margin-bottom: 0.3rem; }

    .inc-seen-btn {
      background: #334155; border: none; color: #94a3b8;
      padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.68rem;
      cursor: pointer; white-space: nowrap;
    }
    .inc-seen-btn.seen { background: #22c55e22; color: #22c55e; cursor: default; }
    .stat-box {
      flex: 1; min-width: 140px; background: #1e293b;
      border-radius: 12px; padding: 1.2rem;
      border-top: 3px solid var(--accent); text-align: center;
    }
    .stat-box h2 { font-size: 2rem; color: var(--accent); }
    .stat-box p  { color: #94a3b8; font-size: 0.85rem; }

    .filters { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: center; }
    .filters select, .filters input {
      background: #1e293b; border: 1px solid #334155; color: #f1f5f9;
      padding: 0.55rem 0.9rem; border-radius: 8px; font-size: 0.88rem;
    }
    .filters button {
      padding: 0.55rem 1.2rem; border-radius: 8px; border: none;
      background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer;
    }

    .table-wrap { background: #1e293b; border-radius: 12px; overflow-x: auto; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    thead tr { background: #0f172a; color: #94a3b8; text-align: left; }
    thead th { padding: 0.9rem 1rem; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #1e293b; }
    tbody tr:hover { background: #0f172a; }
    tbody td { padding: 0.85rem 1rem; color: #e2e8f0; vertical-align: middle; }

    .badge {
      padding: 0.2rem 0.65rem; border-radius: 999px;
      font-size: 0.72rem; font-weight: bold; white-space: nowrap;
    }
    .badge-hospital  { background: #22c55e22; color: #22c55e; }
    .badge-police    { background: #38bdf822; color: #38bdf8; }
    .badge-fire      { background: #f59e0b22; color: #f59e0b; }
    .badge-ambulance { background: #ef444422; color: #ef4444; }
    .badge-active    { background: #22c55e; color: #0f172a; }
    .badge-inactive  { background: #475569; color: #f1f5f9; }

    .load-bar-wrap { width: 90px; height: 6px; background: #334155; border-radius: 999px; overflow: hidden; }
    .load-bar { height: 100%; background: #38bdf8; }
    .load-bar.high { background: #f59e0b; }
    .load-bar.full { background: #ef4444; }
    .load-text { font-size: 0.72rem; color: #64748b; margin-top: 0.2rem; }

    .action-btn {
      padding: 0.3rem 0.7rem; border-radius: 6px; border: none;
      cursor: pointer; font-size: 0.78rem; font-weight: bold; margin-right: 4px;
    }
    .btn-edit   { background: #334155; color: #f1f5f9; }
    .btn-toggle { background: #f59e0b; color: #0f172a; }
    .btn-delete { background: #ef4444; color: #fff; }

    .pagination {
      display: flex; justify-content: flex-end; align-items: center;
      gap: 0.6rem; margin-top: 1.2rem; font-size: 0.85rem; color: #94a3b8;
    }
    .pagination button {
      background: #1e293b; border: 1px solid #334155; color: #f1f5f9;
      padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer;
    }
    .pagination button:disabled { opacity: 0.4; cursor: default; }

    /* Drawer (add / edit form) */
    .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 2000; }
    .drawer-overlay.open { display: block; }
    .drawer {
      position: fixed; top: 0; right: 0; width: 400px; max-width: 92vw;
      height: 100%; background: #1e293b; border-left: 1px solid #334155;
      padding: 2rem; overflow-y: auto; z-index: 2001;
    }
    .drawer h3 { color: #38bdf8; margin-bottom: 1rem; }
    .drawer-close {
      position: absolute; top: 1rem; right: 1rem; background: #334155;
      border: none; color: #f1f5f9; padding: 0.4rem 0.8rem;
      border-radius: 6px; cursor: pointer;
    }
    .field { margin-bottom: 0.9rem; }
    .field label { display: block; color: #94a3b8; font-size: 0.75rem; margin-bottom: 0.3rem; }
    .field input, .field select {
      width: 100%; box-sizing: border-box;
      background: #0f172a; border: 1px solid #334155;
      color: #f1f5f9; padding: 0.6rem 0.8rem; border-radius: 8px; font-size: 0.88rem;
    }
    .field-row { display: flex; gap: 0.7rem; }
    .field-row .field { flex: 1; }
    .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.9rem; }
    .checkbox-row label { color: #94a3b8; font-size: 0.85rem; }

    .drawer-actions { margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid #334155; display: flex; gap: 0.6rem; }
    .save-btn {
      flex: 1; padding: 0.65rem; background: #22c55e; color: #0f172a;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    .del-btn {
      padding: 0.65rem 1rem; background: #ef4444; color: #fff;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    .empty-row { text-align: center; color: #64748b; padding: 2rem; }
  </style>
</head>
<body>

  <nav id="navbar"></nav>

  <div class="rm-main">

    <div class="rm-head">
      <div>
        <h2>🚑 Responder Manager</h2>
        <div class="rm-who" id="r-who">Loading…</div>
      </div>
      <div style="display:flex; gap:0.8rem; align-items:center;">
        <span class="role-pill" id="r-role">Admin</span>
        <button class="add-btn" id="r-add">+ Add Responder</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-box" style="--accent:#38bdf8"><h2 id="s-total">--</h2><p>Total Responders</p></div>
      <div class="stat-box" style="--accent:#22c55e"><h2 id="s-active">--</h2><p>Active</p></div>
      <div class="stat-box" style="--accent:#ef4444"><h2 id="s-capacity">--</h2><p>At Capacity</p></div>
      <div class="stat-box" style="--accent:#f59e0b"><h2 id="s-avgload">--</h2><p>Avg Load</p></div>
    </div>

    <!-- RECENT INCIDENTS — what got reported, and what happened as a
         result: dispatched+ETA (critical), awaiting approval (medium/
         high), or pharmacy suggestion (low medical). Click one to expand. -->
    <div class="incidents-panel">
      <div class="incidents-head">
        <h3>🚨 Recent Incidents</h3>
        <button id="inc-refresh" class="inc-refresh-btn">🔄 Refresh</button>
      </div>
      <div id="incidents-list">
        <div class="empty-row">Loading…</div>
      </div>
    </div>

    <div class="filters">
      <select id="f-type">
        <option value="">All Types</option>
        <option value="hospital">🏥 Hospital</option>
        <option value="police">🚔 Police</option>
        <option value="fire">🔥 Fire</option>
        <option value="ambulance">🚑 Ambulance</option>
      </select>
      <select id="f-active">
        <option value="">Active + Inactive</option>
        <option value="true">Active only</option>
        <option value="false">Inactive only</option>
      </select>
      <input type="text" id="f-search" placeholder="🔍 Search name or address…" />
      <button id="f-apply">Apply</button>
      <button id="f-reset" style="background:#334155; color:#f1f5f9;">Reset</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Phone</th>
            <th>Load</th>
            <th>Dispatch</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="responder-table-body">
          <tr><td colspan="7" class="empty-row">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <button id="pg-prev">← Prev</button>
      <span id="pg-info">Page 1</span>
      <button id="pg-next">Next →</button>
    </div>
  </div>

  <div class="drawer-overlay" id="drawer-overlay">
    <div class="drawer" id="drawer">
      <button class="drawer-close" id="d-close">✕ Close</button>
      <h3 id="d-title">Add Responder</h3>

      <form id="r-form">
        <div class="field">
          <label>Name</label>
          <input type="text" id="fld-name" required />
        </div>
        <div class="field">
          <label>Type</label>
          <select id="fld-type" required>
            <option value="hospital">🏥 Hospital</option>
            <option value="police">🚔 Police</option>
            <option value="fire">🔥 Fire</option>
            <option value="ambulance">🚑 Ambulance</option>
          </select>
        </div>
        <div class="field">
          <label>Phone</label>
          <input type="text" id="fld-phone" required />
        </div>
        <div class="field">
          <label>Address</label>
          <input type="text" id="fld-address" />
        </div>
        <div class="field-row">
          <div class="field">
            <label>Latitude</label>
            <input type="number" step="any" id="fld-lat" required />
          </div>
          <div class="field">
            <label>Longitude</label>
            <input type="number" step="any" id="fld-lng" required />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Capacity</label>
            <input type="number" min="0" id="fld-capacity" value="10" />
          </div>
          <div class="field">
            <label>Current Load</label>
            <input type="number" min="0" id="fld-load" value="0" />
          </div>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="fld-isactive" checked />
          <label for="fld-isactive">Active (eligible for dispatch)</label>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="fld-available" checked />
          <label for="fld-available">Available (not at capacity)</label>
        </div>
      </form>

      <div class="drawer-actions">
        <button class="save-btn" id="d-save">Save</button>
        <button class="del-btn" id="d-delete" style="display:none;">Delete</button>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script type="module" src="../js/responder-manager.js"></script>
</body>
</html>
