<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Ballari — Plan a Trip</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .it-main { max-width: 1180px; margin: 0 auto; padding: 2rem 1.5rem; }

    .it-head h2 { font-size: 1.4rem; }
    .it-head p  { color: #64748b; font-size: 0.86rem; margin-top: 0.25rem; }

    .it-grid {
      display: grid; grid-template-columns: 330px 1fr;
      gap: 1.2rem; margin-top: 1.4rem; align-items: start;
    }
    @media (max-width: 900px) { .it-grid { grid-template-columns: 1fr; } }

    /* ── form ── */
    .panel {
      background: #1e293b; border: 1px solid #334155;
      border-radius: 14px; padding: 1.1rem;
    }
    .fld { margin-bottom: 1rem; }
    .fld label {
      display: block; font-size: 0.74rem; text-transform: uppercase;
      letter-spacing: 0.06em; color: #64748b; margin-bottom: 0.45rem;
    }
    .fld select, .fld input {
      width: 100%; background: #0f172a; color: #f1f5f9;
      border: 1px solid #334155; border-radius: 9px;
      padding: 0.55rem 0.7rem; font-size: 0.86rem; font-family: inherit;
    }
    .fld select:focus, .fld input:focus { outline: none; border-color: #f59e0b; }

    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .chip {
      background: #0f172a; color: #94a3b8; border: 1px solid #334155;
      border-radius: 999px; padding: 0.38rem 0.8rem;
      font-size: 0.78rem; cursor: pointer; font-family: inherit;
      user-select: none;
    }
    .chip.on { border-color: #f59e0b; color: #f59e0b; background: rgba(245,158,11,0.09); }

    .seg { display: flex; gap: 0.35rem; }
    .seg button {
      flex: 1; background: #0f172a; color: #94a3b8;
      border: 1px solid #334155; border-radius: 9px;
      padding: 0.5rem 0.3rem; font-size: 0.78rem;
      cursor: pointer; font-family: inherit;
    }
    .seg button.on { border-color: #f59e0b; color: #f59e0b; background: rgba(245,158,11,0.09); }

    .go-btn {
      width: 100%; background: #f59e0b; color: #0f172a; border: none;
      border-radius: 10px; padding: 0.8rem;
      font-size: 0.92rem; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .go-btn:hover:not(:disabled) { background: #d97706; }
    .go-btn:disabled { background: #334155; color: #64748b; cursor: default; }

    /* ── result ── */
    .result-head {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 0.6rem; margin-bottom: 0.9rem;
    }
    .badge {
      font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 999px;
      border: 1px solid #334155; color: #94a3b8; background: #0f172a;
    }
    .badge.ai    { color: #a78bfa; border-color: #a78bfa55; }
    .badge.rules { color: #38bdf8; border-color: #38bdf855; }

    .daytabs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
    .daytab {
      background: #1e293b; color: #94a3b8; border: 1px solid #334155;
      border-radius: 9px; padding: 0.45rem 0.9rem;
      font-size: 0.8rem; cursor: pointer; font-family: inherit;
    }
    .daytab.on { border-color: #f59e0b; color: #f59e0b; }

    #route-map {
      height: 300px; border-radius: 12px;
      border: 1px solid #334155; margin-bottom: 1rem;
    }

    .tl { position: relative; padding-left: 1.5rem; }
    .tl::before {
      content: ''; position: absolute; left: 6px; top: 8px; bottom: 8px;
      width: 2px; background: linear-gradient(180deg, #f59e0b, #334155);
    }
    .stop {
      position: relative; background: #1e293b; border: 1px solid #334155;
      border-radius: 12px; padding: 0.8rem 0.95rem; margin-bottom: 0.7rem;
    }
    .stop::before {
      content: ''; position: absolute; left: -1.5rem; top: 1.05rem;
      width: 12px; height: 12px; border-radius: 50%;
      background: #f59e0b; border: 2px solid #0f172a;
    }
    .stop.mon::before { background: #a78bfa; }
    .stop-top {
      display: flex; justify-content: space-between;
      align-items: baseline; gap: 0.6rem; flex-wrap: wrap;
    }
    .stop-time { color: #f59e0b; font-size: 0.78rem; font-weight: 700; }
    .stop-name { font-size: 0.95rem; font-weight: 600; color: #f1f5f9; }
    .stop-meta { color: #64748b; font-size: 0.73rem; margin-top: 0.15rem; }
    .stop-note { color: #94a3b8; font-size: 0.82rem; margin-top: 0.4rem; line-height: 1.55; }
    .stop-acts { display: flex; gap: 0.4rem; margin-top: 0.6rem; flex-wrap: wrap; }
    .mini {
      background: #0f172a; border: 1px solid #334155; color: #cbd5e1;
      border-radius: 7px; padding: 0.3rem 0.65rem;
      font-size: 0.73rem; cursor: pointer; text-decoration: none;
      font-family: inherit; display: inline-block;
    }
    .mini:hover { border-color: #f59e0b; color: #f59e0b; }
    .mini.ar { border-color: #a78bfa55; color: #a78bfa; }

    .travel-note {
      background: #0f172a; border-left: 2px solid #38bdf8;
      border-radius: 7px; padding: 0.5rem 0.7rem;
      font-size: 0.78rem; color: #94a3b8; margin-bottom: 0.8rem;
    }

    .attrib {
      margin-top: 1.2rem; padding-top: 0.8rem; border-top: 1px solid #334155;
      font-size: 0.7rem; color: #475569; line-height: 1.6;
    }
    .empty { text-align: center; padding: 3rem 1rem; color: #64748b; }
    .empty h3 { color: #cbd5e1; font-size: 1rem; margin-bottom: 0.4rem; }
  </style>
</head>
<body>

  <nav id="navbar"></nav>

  <div class="it-main">
    <div class="it-head">
      <h2>🧭 Plan a Trip</h2>
      <p>Build a day-by-day plan across Ballari, Hospet, Hampi, Anegundi and Sandur.</p>
    </div>

    <div class="it-grid">
      <!-- ── FORM ── -->
      <div class="panel">
        <div class="fld">
          <label>How many days?</label>
          <select id="f-days">
            <option value="1">1 day</option>
            <option value="2" selected>2 days</option>
            <option value="3">3 days</option>
            <option value="4">4 days</option>
            <option value="5">5 days</option>
          </select>
        </div>

        <div class="fld">
          <label>Starting from</label>
          <select id="f-town"></select>
        </div>

        <div class="fld">
          <label>Travelling as</label>
          <div class="seg" id="f-with">
            <button data-v="solo">Solo</button>
            <button data-v="couple">Couple</button>
            <button data-v="family" class="on">Family</button>
            <button data-v="friends">Friends</button>
          </div>
        </div>

        <div class="fld">
          <label>Pace</label>
          <div class="seg" id="f-pace">
            <button data-v="relaxed">Relaxed</button>
            <button data-v="balanced" class="on">Balanced</button>
            <button data-v="packed">Packed</button>
          </div>
        </div>

        <div class="fld">
          <label>Interests</label>
          <div class="chips" id="f-interests">
            <button class="chip on" data-v="heritage">🏛 Heritage</button>
            <button class="chip"    data-v="temples">🛕 Temples</button>
            <button class="chip"    data-v="nature">🌿 Nature</button>
            <button class="chip"    data-v="views">🌄 Views</button>
            <button class="chip"    data-v="family">👨‍👩‍👧 Family</button>
            <button class="chip"    data-v="photo">📷 Photography</button>
          </div>
        </div>

        <button class="go-btn" id="go" onclick="generate()">Build my itinerary</button>
      </div>

      <!-- ── RESULT ── -->
      <div>
        <div id="result">
          <div class="empty">
            <h3>Nothing planned yet</h3>
            <p>Pick your days and interests, then build an itinerary.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/itinerary.js"></script>
</body>
</html>
