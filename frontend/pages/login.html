<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Ballari — Login</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #10151c;
      --panel: #182129;
      --panel-edge: #202b35;
      --accent: #e8a33d;
      --accent-2: #4fa9a0;
      --text: #edeae1;
      --muted: #8b94a0;
      --border: #2a3540;
      --error: #e2574c;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .auth-shell {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      min-height: 100vh;
    }

    /* ---------- Left: city panel ---------- */
    .city-panel {
      position: relative;
      overflow: hidden;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .grid-lines {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.5;
      mask-image: radial-gradient(circle at 30% 40%, black, transparent 75%);
    }

    .city-panel > * { position: relative; z-index: 1; }

    .locate {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.02em;
    }

    .locate svg { flex-shrink: 0; }

    .skyline {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 2rem 0;
    }

    .skyline svg { width: 100%; height: auto; max-width: 420px; }

    .wordmark {
      animation: rise 0.6s ease-out;
    }

    .wordmark h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(2.4rem, 5vw, 3.4rem);
      line-height: 1.05;
      margin: 0 0 0.9rem;
      color: var(--text);
    }

    .wordmark h1 span {
      color: var(--accent);
    }

    .wordmark p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      max-width: 34ch;
      margin: 0 0 1.8rem;
    }

    .role-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .role-tags span {
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
      border-radius: 3px;
      background: rgba(255,255,255,0.02);
    }

    .role-tags span::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-2);
      margin-right: 0.5rem;
    }

    /* ---------- Right: form panel ---------- */
    .form-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-container {
      width: 100%;
      max-width: 380px;
      animation: rise 0.6s ease-out 0.1s backwards;
    }

    .auth-container h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.6rem;
      font-weight: 600;
      margin: 0 0 0.4rem;
    }

    .auth-container .sub {
      color: var(--muted);
      font-size: 0.92rem;
      margin: 0 0 2rem;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 1.15rem;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .field input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      padding: 0.75rem 0.85rem;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .field input::placeholder { color: #5c6570; }

    .field input:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(79, 169, 160, 0.18);
    }

    .actions {
      display: flex;
      gap: 0.7rem;
      margin-top: 1.6rem;
    }

    button {
      flex: 1;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.15s ease;
    }

    button:active { transform: translateY(1px); }

    #login-btn {
      background: var(--accent);
      color: #1a1305;
    }

    #login-btn:hover { filter: brightness(1.08); }

    #register-btn {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }

    #register-btn:hover { border-color: var(--accent-2); }

    #error-msg {
      margin-top: 1.1rem;
      min-height: 1.2rem;
      font-size: 0.85rem;
      color: var(--error);
    }

    #error-msg:empty { display: none; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .wordmark, .auth-container { animation: none; }
    }

    @media (max-width: 860px) {
      .auth-shell { grid-template-columns: 1fr; }
      .city-panel {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 2rem;
        min-height: 260px;
      }
      .wordmark { margin-top: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="city-panel">
      <div class="grid-lines"></div>

      <div class="locate">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 21s-7-6.5-7-11.5A7 7 0 0 1 19 9.5C19 14.5 12 21 12 21z"/>
          <circle cx="12" cy="9.5" r="2.3"/>
        </svg>
        Ballari, Karnataka
      </div>

      <div class="skyline" aria-hidden="true">
        <svg viewBox="0 0 420 260" fill="none">
          <!-- blueprint baseline -->
          <line x1="0" y1="210" x2="420" y2="210" stroke="var(--border)" stroke-width="1"/>

          <!-- Ballari hill outline (Kumara Parvatha / Rock Fort silhouette) -->
          <path d="M0 210 L60 150 L95 180 L140 120 L175 165 L210 145 L240 210 Z"
                fill="var(--panel-edge)" stroke="var(--border)" stroke-width="1.2"/>

          <!-- fort marker on the hill -->
          <rect x="132" y="106" width="8" height="14" fill="var(--accent)"/>
          <rect x="128" y="100" width="16" height="6" fill="var(--accent)"/>

          <!-- city block grid -->
          <g stroke="var(--border)" stroke-width="1">
            <rect x="245" y="150" width="34" height="60" fill="var(--panel-edge)"/>
            <rect x="285" y="120" width="34" height="90" fill="var(--panel-edge)"/>
            <rect x="325" y="165" width="30" height="45" fill="var(--panel-edge)"/>
            <rect x="361" y="140" width="34" height="70" fill="var(--panel-edge)"/>
          </g>
          <g stroke="var(--border)" stroke-width="1" opacity="0.6">
            <line x1="285" y1="135" x2="319" y2="135"/>
            <line x1="285" y1="150" x2="319" y2="150"/>
            <line x1="285" y1="165" x2="319" y2="165"/>
            <line x1="285" y1="180" x2="319" y2="180"/>
            <line x1="285" y1="195" x2="319" y2="195"/>
            <line x1="361" y1="155" x2="395" y2="155"/>
            <line x1="361" y1="170" x2="395" y2="170"/>
            <line x1="361" y1="185" x2="395" y2="185"/>
          </g>

          <!-- civic pin over a neighbourhood -->
          <path d="M60 175 C60 165 68 158 76 158 C84 158 92 165 92 175 C92 187 76 202 76 202 C76 202 60 187 60 175 Z"
                fill="var(--accent)"/>
          <circle cx="76" cy="174" r="5" fill="var(--panel)"/>

          <!-- bus / transit route -->
          <path d="M10 210 C 60 190, 140 230, 210 200 S 340 175, 405 205"
                stroke="var(--accent-2)" stroke-width="1.6" stroke-dasharray="2 6" stroke-linecap="round"/>
          <circle cx="10" cy="210" r="3" fill="var(--accent-2)"/>
          <circle cx="210" cy="200" r="3" fill="var(--accent-2)"/>
          <circle cx="405" cy="205" r="3" fill="var(--accent-2)"/>
        </svg>
      </div>

      <div class="wordmark">
        <h1>Smart<br /><span>Ballari</span></h1>
        <p>One civic platform for reporting issues, tracking services, and exploring the city — built for the people who live in it and visit it.</p>
        <div class="role-tags">
          <span>Citizen</span>
          <span>Tourist</span>
          <span>Department admin</span>
          <span>City admin</span>
        </div>
      </div>
    </div>

    <div class="form-panel">
      <div class="auth-container">
        <h3>Sign in</h3>
        <p class="sub">Enter your details to access your civic dashboard.</p>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" />
        </div>

        <div class="actions">
          <button id="login-btn" onclick="login()">Login</button>
          <button id="register-btn" onclick="register()">Register</button>
        </div>

        <p id="error-msg"></p>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script type="module" src="../js/auth.js"></script>
</body>
</html>
