<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Ballari — Government Offices</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .go-main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    .go-header { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 1.6rem; }
    .go-header-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #38bdf8, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .go-header h1 { color: #f1f5f9; font-size: 1.35rem; margin: 0; }
    .go-header p  { color: #94a3b8; font-size: 0.85rem; margin: 0.15rem 0 0; }

    .go-controls {
      display: flex;
      gap: 0.7rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .go-search {
      flex: 1;
      min-width: 220px;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 0.65rem 1rem;
    }
    .go-search input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f1f5f9;
      font-size: 0.88rem;
    }
    .go-search input::placeholder { color: #64748b; }

    /* Category as a dropdown, not pill buttons */
    .go-category-select {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      min-width: 190px;
      outline: none;
    }
    .go-category-select:focus { border-color: #38bdf8; }

    .go-count { color: #64748b; font-size: 0.8rem; margin-bottom: 1rem; }

    .go-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .go-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
    }

    .go-card-top { display: flex; align-items: flex-start; gap: 0.8rem; margin-bottom: 0.7rem; }
    .go-icon {
      width: 42px; height: 42px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
      color: #0f172a;
    }
    .go-card-title { flex: 1; min-width: 0; }
    .go-card-title h4 { color: #f1f5f9; font-size: 0.92rem; margin: 0 0 0.3rem; line-height: 1.3; }
    .go-cat-badge {
      display: inline-block;
      padding: 0.12rem 0.5rem;
      border-radius: 999px;
      font-size: 0.66rem;
      font-weight: 700;
      background: #38bdf822;
      color: #38bdf8;
    }

    .go-desc { color: #94a3b8; font-size: 0.8rem; line-height: 1.5; margin-bottom: 0.7rem; }

    .go-detail {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 0.35rem;
      line-height: 1.4;
    }
    .go-detail a { color: #38bdf8; text-decoration: none; }
    .go-detail a:hover { text-decoration: underline; }

    .go-directions-btn {
      margin-top: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.6rem;
      background: #38bdf8;
      color: #0f172a;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.82rem;
    }
    .go-directions-btn:hover { background: #0ea5e9; }

    .go-empty { color: #64748b; text-align: center; padding: 2rem; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <nav id="navbar"></nav>

  <div class="go-main">

    <div class="go-header">
      <div class="go-header-icon">🏛️</div>
      <div>
        <h1>Government Offices</h1>
        <p>Important government offices in Ballari with directions</p>
      </div>
    </div>

    <div class="go-controls">
      <div class="go-search">
        <span>🔍</span>
        <input type="text" id="go-search-input" placeholder="Search by name, area, or address..." oninput="renderOffices()" />
      </div>
      <select class="go-category-select" id="go-category-select" onchange="renderOffices()">
        <option value="all">All Offices</option>
        <!-- other options filled by JS from the data -->
      </select>
    </div>

    <div class="go-count" id="go-count"></div>

    <div class="go-grid" id="go-grid"></div>

  </div>

  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/govt-offices.js"></script>
</body>
</html>
