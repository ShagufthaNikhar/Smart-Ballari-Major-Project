<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Ballari — Education</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .edu-main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    .edu-tabs { display: flex; gap: 0.5rem; margin-bottom: 0.9rem; flex-wrap: wrap; }
    .edu-tab {
      background: #1e293b; border: 1px solid #334155; color: #94a3b8;
      padding: 0.4rem 0.9rem; border-radius: 999px; font-size: 0.8rem;
      cursor: pointer; transition: all 0.2s;
    }
    .edu-tab:hover { border-color: #38bdf8; }
    .edu-tab.active { background: #38bdf822; border-color: #38bdf8; color: #38bdf8; }

    .search-bar { display: flex; gap: 0.8rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
    .search-bar input, .search-bar select {
      background: #1e293b; border: 1px solid #334155; color: #f1f5f9;
      padding: 0.6rem 0.9rem; border-radius: 8px; font-size: 0.88rem;
    }
    .search-bar input { flex: 1; min-width: 200px; }
    .search-bar select { min-width: 240px; }
    .search-bar input:focus, .search-bar select:focus { outline: none; border-color: #38bdf8; }
    .search-bar option:disabled { color: #475569; }

    .edu-count { color: #64748b; font-size: 0.78rem; margin-bottom: 1rem; }

    .edu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .edu-card {
      background: #1e293b; border-radius: 14px; border: 1px solid #334155;
      overflow: hidden; transition: border-color 0.2s;
    }
    .edu-card:hover { border-color: #38bdf8; }

    .edu-header {
      padding: 1.2rem; background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid #334155;
    }
    .edu-icon { font-size: 2.4rem; }
    .edu-name { font-weight: bold; font-size: 0.9rem; line-height: 1.3; }
    .edu-type {
      display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px;
      font-size: 0.68rem; font-weight: bold; background: #38bdf822; color: #38bdf8;
    }
    .edu-govt {
      margin-left: 0.3rem; background: #22c55e22; color: #22c55e;
      border-radius: 999px; padding: 0.15rem 0.5rem;
      font-size: 0.65rem; font-weight: bold;
    }

    .edu-body { padding: 1rem; }
    .edu-detail {
      display: flex; gap: 0.5rem; font-size: 0.78rem;
      color: #64748b; margin-bottom: 0.35rem; line-height: 1.4;
    }
    .edu-chips { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.6rem 0; }
    .edu-chip {
      background: #0f172a; border: 1px solid #334155; color: #94a3b8;
      border-radius: 4px; padding: 0.15rem 0.5rem; font-size: 0.68rem;
    }
    .edu-rating {
      background: #f59e0b11; border: 1px solid #f59e0b44; border-radius: 6px;
      padding: 0.35rem 0.6rem; font-size: 0.72rem; color: #fbbf24; margin-top: 0.5rem;
    }
    .edu-actions { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
    .edu-btn {
      flex: 1; padding: 0.45rem; background: #0f172a; border: 1px solid #334155;
      color: #94a3b8; border-radius: 6px; font-size: 0.72rem;
      text-align: center; text-decoration: none;
    }
    .edu-btn:hover { border-color: #38bdf8; color: #38bdf8; }
    .edu-btn-call { background: #22c55e22; border-color: #22c55e; color: #22c55e; }
  </style>
</head>
<body>

  <nav id="navbar"></nav>

  <div class="edu-main">
    <div style="margin-bottom:1.2rem;">
      <h2>🎓 Education</h2>
      <p style="color:#64748b; font-size:0.85rem; margin-top:0.2rem;">
        Schools, PU colleges, degree colleges and professional institutions in Ballari
      </p>
    </div>

    <div class="edu-tabs">
      <button class="edu-tab active" data-group="">All</button>
      <button class="edu-tab" data-group="school">🏫 Schools</button>
      <button class="edu-tab" data-group="college">🎓 Colleges</button>
    </div>

    <div class="search-bar">
      <input type="text" id="edu-search"
        placeholder="🔍 Search by name, area or type..." />
      <select id="edu-category">
        <option value="">All Types</option>
      </select>
    </div>

    <div class="edu-count" id="edu-count"></div>

    <div class="edu-grid" id="edu-grid">
      <p style="color:#64748b;">Loading...</p>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/education.js"></script>
</body>
</html>
