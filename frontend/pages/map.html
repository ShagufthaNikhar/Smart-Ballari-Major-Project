<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Ballari — Map</title>
  <link rel="stylesheet" href="../css/style.css" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    #map { height: calc(100vh - 60px); width: 100%; }

    /* Floating controls */
    .map-controls {
      position: absolute;
      top: 80px; right: 16px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .map-btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .map-btn:hover { background: #38bdf8; color: #0f172a; }
    .map-btn.active { background: #38bdf8; color: #0f172a; }

    /* Layer toggle panel */
    .layer-panel {
      position: absolute;
      top: 80px; left: 16px;
      z-index: 999;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 0.8rem 1rem;
      font-size: 0.85rem;
      color: #f1f5f9;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
    }
    .layer-panel h4 { margin-bottom: 0.5rem; color: #38bdf8; }
    .layer-panel h4.layer-subhead {
      margin-top: 0.9rem;
      padding-top: 0.7rem;
      border-top: 1px solid #334155;
    }
    .layer-panel h4.layer-subhead:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }
    .layer-panel label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
      cursor: pointer;
    }
    .layer-panel .layer-loading {
      font-size: 0.72rem;
      color: #64748b;
      margin: -0.2rem 0 0.4rem 1.6rem;
      display: none;
    }
    .layer-panel .layer-loading.show { display: block; }

    /* Nearby Places dropdown */
    .poi-dropdown {
      margin-top: 0.9rem;
      padding-top: 0.7rem;
      border-top: 1px solid #334155;
    }
    .poi-dropdown:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }
    .poi-dropdown summary {
      cursor: pointer;
      color: #38bdf8;
      font-weight: 700;
      font-size: 0.85rem;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }
    .poi-dropdown summary::-webkit-details-marker { display: none; }
    .poi-dropdown summary::after {
      content: '▾';
      transition: transform 0.15s;
      font-size: 0.75rem;
    }
    .poi-dropdown[open] summary::after { transform: rotate(180deg); }
    .poi-list {
      margin-top: 0.6rem;
      padding-left: 0.1rem;
    }

    /* Report modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1e293b;
      border-radius: 14px;
      padding: 2rem;
      width: 360px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .modal h3 { color: #38bdf8; }
    .modal input, .modal select, .modal textarea {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      font-size: 0.9rem;
      width: 100%;
    }
    .modal textarea { resize: vertical; min-height: 80px; }
    .modal-btns { display: flex; gap: 0.8rem; }
    .modal-btns button {
      flex: 1; padding: 0.7rem;
      border-radius: 8px; border: none;
      font-weight: bold; cursor: pointer;
    }
    #submit-issue { background: #38bdf8; color: #0f172a; }
    #cancel-modal { background: #334155; color: #f1f5f9; }
  </style>
</head>
<body>

  <nav id="navbar"></nav>

  <!-- Layer toggle -->
  <div class="layer-panel">
    <details class="poi-dropdown" id="issues-dropdown" open>
      <summary>🗂️ Issue Layers</summary>
      <div class="poi-list">
        <label><input type="checkbox" id="layer-all" checked /> All Issues</label>
        <label><input type="checkbox" id="layer-road" checked /> 🛣️ Roads</label>
        <label><input type="checkbox" id="layer-water" checked /> 💧 Water</label>
        <label><input type="checkbox" id="layer-electric" checked /> ⚡ Electric</label>
        <label><input type="checkbox" id="layer-sanitation" checked /> 🗑️ Sanitation</label>
      </div>
    </details>

    <details class="poi-dropdown" id="poi-dropdown">
      <summary>📍 Nearby Places</summary>
      <div class="poi-list">
        <label><input type="checkbox" id="layer-hospital" /> 🏥 Hospitals</label>
        <div class="layer-loading" id="loading-hospital">Loading hospitals…</div>

        <label><input type="checkbox" id="layer-school" /> 🏫 Schools</label>
        <div class="layer-loading" id="loading-school">Loading schools…</div>

        <label><input type="checkbox" id="layer-govt" /> 🏛️ Government Offices</label>
        <div class="layer-loading" id="loading-govt">Loading offices…</div>

        <label><input type="checkbox" id="layer-fire" /> 🚒 Fire Stations</label>
        <div class="layer-loading" id="loading-fire">Loading fire stations…</div>

        <label><input type="checkbox" id="layer-bank" /> 🏦 Banks</label>
        <div class="layer-loading" id="loading-bank">Loading banks…</div>

        <label><input type="checkbox" id="layer-police" /> 🚓 Police Stations</label>
        <div class="layer-loading" id="loading-police">Loading police stations…</div>

        <label><input type="checkbox" id="layer-bus" /> 🚌 Bus Terminals</label>
        <div class="layer-loading" id="loading-bus">Loading bus terminals…</div>

        <label><input type="checkbox" id="layer-park" /> 🌳 City Parks</label>
        <div class="layer-loading" id="loading-park">Loading parks…</div>

        <label><input type="checkbox" id="layer-temple" /> 🛕 Temples</label>
        <div class="layer-loading" id="loading-temple">Loading temples…</div>

        <label><input type="checkbox" id="layer-church" /> ⛪ Churches</label>
        <div class="layer-loading" id="loading-church">Loading churches…</div>

        <label><input type="checkbox" id="layer-masjid" /> 🕌 Masjids</label>
        <div class="layer-loading" id="loading-masjid">Loading masjids…</div>
      </div>
    </details>
  </div>

  <!-- Floating action buttons -->
  <div class="map-controls">
    <button class="map-btn" id="btn-gps">📍 My Location</button>
    <button class="map-btn" id="btn-pin">📌 Pin Issue</button>
    <button class="map-btn" id="btn-reset">🔄 Reset View</button>
  </div>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Report Issue Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3>📌 Report Issue</h3>
      <p id="modal-coords" style="color:#94a3b8; font-size:0.8rem;"></p>
      <input type="text" id="issue-title" placeholder="Issue title (e.g. Pothole on MG Road)" />
      <select id="issue-category">
        <option value="">-- Select Category --</option>
        <option value="road">🛣️ Road / Pothole</option>
        <option value="water">💧 Water Supply</option>
        <option value="electric">⚡ Electricity</option>
        <option value="sanitation">🗑️ Sanitation</option>
        <option value="other">📦 Other</option>
      </select>
      <textarea id="issue-desc" placeholder="Describe the issue..."></textarea>
      <div class="modal-btns">
        <button id="submit-issue">Submit</button>
        <button id="cancel-modal">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/map.js"></script>
</body>
</html>
