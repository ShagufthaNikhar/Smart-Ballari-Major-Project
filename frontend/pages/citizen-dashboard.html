<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Ballari — My Dashboard</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .citizen-main {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* ── TRUST HERO ── */
    .trust-hero {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-radius: 16px;
      padding: 1.5rem 2rem;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .trust-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      flex-shrink: 0;
      border: 3px solid var(--lcolor, #334155);
    }

    .trust-info { min-width: 0; }
    .trust-info h3 { font-size: 1.05rem; margin-bottom: 0.2rem; color: #f1f5f9; }
    .trust-info p  { color: #64748b; font-size: 0.82rem; }

    .trust-score-big { margin-left: auto; text-align: center; }

    .trust-score-big .num {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--lcolor, #38bdf8);
      line-height: 1;
    }

    .trust-score-big .lbl {
      font-size: 0.72rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ── GRID ── */
    .citizen-grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 1rem;
      align-items: start;
    }

    @media (max-width: 700px) {
      .citizen-grid { grid-template-columns: 1fr; }
      .trust-score-big { margin-left: 0; }
    }

    /* ── WIDGET ── */
    .c-widget {
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .c-widget-head {
      padding: 0.7rem 1rem;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      font-size: 0.78rem;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .c-widget-head span:first-child { color: #94a3b8; }
    .c-widget-head a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.72rem;
    }
    .c-widget-body { padding: 1rem; }

    /* Issue row */
    .my-issue-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid #0f172a;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .my-issue-row:last-child { border: none; }
    .my-issue-row:hover {
      background: #0f172a;
      margin: 0 -1rem;
      padding: 0.55rem 1rem;
    }

    /* Service / history link rows */
    .link-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.6rem;
      background: #0f172a;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.8rem;
      color: #f1f5f9;
      border: 1px solid transparent;
      transition: border-color 0.15s;
    }

    .link-row:hover { border-color: #334155; }
    .link-row .arrow { margin-left: auto; color: #38bdf8; font-size: 0.72rem; }
    .link-row .when  { margin-left: auto; color: #475569; font-size: 0.7rem; }
    .link-stack { display: flex; flex-direction: column; gap: 0.5rem; }

    /* Badges row */
    .badges-mini {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-top: 0.4rem;
    }

    .badge-mini {
      background: #f59e0b11;
      border: 1px solid #f59e0b44;
      border-radius: 6px;
      padding: 0.2rem 0.5rem;
      font-size: 0.72rem;
      color: #fbbf24;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 1.5rem;
      color: #475569;
      font-size: 0.82rem;
    }

    .clear-hist {
      background: none;
      border: none;
      color: #38bdf8;
      font-size: 0.72rem;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <nav id="navbar"></nav>

  <div class="citizen-main">

    <!-- ── 1. NAME + TRUST SCORE ── -->
    <div class="trust-hero">
      <div class="trust-avatar" id="ch-avatar">👤</div>
      <div class="trust-info">
        <h3 id="ch-name">—</h3>
        <p  id="ch-level">Loading profile...</p>
        <div class="badges-mini" id="ch-badges"></div>
      </div>
      <div class="trust-score-big">
        <div class="num" id="ch-score">—</div>
        <div class="lbl">Trust Score</div>
        <div style="font-size:0.68rem; color:#64748b; margin-top:0.2rem;"
             id="ch-reports">— reports</div>
      </div>
    </div>

    <div class="citizen-grid">

      <!-- ── 2. MY REPORTED ISSUES ── -->
      <div>
        <div class="c-widget">
          <div class="c-widget-head">
            <span>📋 My Reported Issues</span>
            <a href="report.html">+ Report new</a>
          </div>
          <div class="c-widget-body" id="my-issues-list">
            <div class="empty-state">Loading your issues...</div>
          </div>
        </div>
      </div>

      <div>
        <!-- ── 3. QUICK SERVICES ── -->
        <div class="c-widget">
          <div class="c-widget-head">
            <span>💼 Quick Services</span>
            <a href="services.html">All →</a>
          </div>
          <div class="c-widget-body">
            <div class="link-stack">
              <a class="link-row" href="jobs.html">
                💼 Job Portal <span class="arrow">View →</span>
              </a>
              <a class="link-row" href="hall-booking.html">
                🏛️ Hall Booking <span class="arrow">Book →</span>
              </a>
              <a class="link-row" href="colleges.html">
                🎓 Colleges Directory <span class="arrow">View →</span>
              </a>
              <a class="link-row" href="civic-portal.html">
                🏛️ Civic Services Portal <span class="arrow">Open →</span>
              </a>
              <a class="link-row" href="heritage.html">
                🏰 Heritage AR
                <span class="arrow" style="color:#7c3aed;">AR →</span>
              </a>
            </div>
          </div>
        </div>

        <!-- ── 4. RECENTLY VISITED ── -->
        <div class="c-widget">
          <div class="c-widget-head">
            <span>🕒 Recently Visited</span>
            <button class="clear-hist" id="ch-clear-history">Clear</button>
          </div>
          <div class="c-widget-body" id="visit-history-list">
            <div class="empty-state">Nothing visited yet.</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/citizen-dashboard.js"></script>
</body>
</html>
