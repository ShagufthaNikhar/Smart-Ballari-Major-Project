<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Ballari — Citizen Services</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .services-main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* ── TAB BAR ── */
    .tab-bar {
      display: flex;
      gap: 0.5rem;
      background: #1e293b;
      border-radius: 12px;
      padding: 0.4rem;
      border: 1px solid #334155;
      margin-bottom: 2rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.7rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      background: transparent;
      color: #64748b;
      transition: all 0.2s;
      text-align: center;
    }

    .tab-btn.active {
      background: #38bdf8;
      color: #0f172a;
    }

    /* ── SEARCH BAR ── */
    .search-bar {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .search-bar input,
    .search-bar select {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      font-size: 0.88rem;
    }

    .search-bar input {
      flex: 1;
      min-width: 200px;
    }

    .search-bar input:focus,
    .search-bar select:focus {
      outline: none;
      border-color: #38bdf8;
    }

    /* ── JOB CARDS ── */
    .jobs-grid {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .job-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      border: 1px solid #334155;
      transition: border-color 0.2s;
    }

    .job-card:hover { border-color: #38bdf8; }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .job-title  { font-size: 1rem; font-weight: bold; }
    .job-company { color: #38bdf8; font-size: 0.85rem; }

    .job-type-badge {
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: bold;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .type-government { background: #22c55e22; color: #22c55e; }
    .type-full-time  { background: #38bdf822; color: #38bdf8; }
    .type-internship { background: #a78bfa22; color: #a78bfa; }
    .type-part-time  { background: #f59e0b22; color: #f59e0b; }
    .type-contract   { background: #94a3b822; color: #94a3b8; }

    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 0.6rem;
    }

    .job-desc {
      color: #94a3b8;
      font-size: 0.82rem;
      line-height: 1.5;
      margin-bottom: 0.6rem;
    }

    .skills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 0.7rem;
    }

    .skill-tag {
      background: #0f172a;
      border: 1px solid #334155;
      color: #cbd5e1;
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      font-size: 0.72rem;
    }

    .job-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .job-deadline {
      font-size: 0.72rem;
      color: #64748b;
    }

    .apply-btn {
      padding: 0.4rem 1rem;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: bold;
      text-decoration: none;
    }

    /* ── COLLEGE CARDS ── */
    .college-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }

    .college-card {
      background: #1e293b;
      border-radius: 14px;
      border: 1px solid #334155;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .college-card:hover { border-color: #38bdf8; }

    .college-header {
      padding: 1.2rem;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid #334155;
    }

    .college-icon { font-size: 2.5rem; }

    .college-name {
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 0.2rem;
      line-height: 1.3;
    }

    .college-type {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: bold;
      background: #38bdf822;
      color: #38bdf8;
    }

    .college-body { padding: 1rem; }

    .college-detail {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 0.35rem;
    }

    .courses-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin: 0.6rem 0;
    }

    .course-tag {
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      font-size: 0.68rem;
    }

    .college-ranking {
      background: #f59e0b11;
      border: 1px solid #f59e0b44;
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      font-size: 0.72rem;
      color: #fbbf24;
      margin-top: 0.5rem;
    }

    /* ── HALL BOOKING ── */
    .halls-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 800px) {
      .halls-layout { grid-template-columns: 1fr; }
    }

    .hall-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 1.2rem;
      border: 1px solid #334155;
      margin-bottom: 0.8rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .hall-card:hover, .hall-card.selected {
      border-color: #38bdf8;
    }

    .hall-card.selected { background: #38bdf808; }

    .hall-name  { font-weight: bold; font-size: 0.95rem; margin-bottom:0.3rem; }
    .hall-area  { color: #64748b; font-size:0.78rem; margin-bottom:0.5rem; }
    .hall-cap   { color: #f59e0b; font-size:0.82rem; margin-bottom:0.4rem; }

    .facilities-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .facility-tag {
      background: #22c55e11;
      border: 1px solid #22c55e33;
      color: #22c55e;
      border-radius: 4px;
      padding: 0.1rem 0.45rem;
      font-size: 0.68rem;
    }

    .hall-price {
      margin-top: 0.5rem;
      font-size:0.8rem;
      color: #38bdf8;
      font-weight: bold;
    }

    /* Booking form */
    .booking-form {
      background: #1e293b;
      border-radius: 14px;
      padding: 1.5rem;
      border: 1px solid #334155;
      position: sticky;
      top: 80px;
    }

    .booking-form h4 {
      color: #38bdf8;
      font-size: 0.88rem;
      margin-bottom: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-field {
      margin-bottom: 0.8rem;
    }

    .form-field label {
      display: block;
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 0.3rem;
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      font-size: 0.85rem;
      box-sizing: border-box;
    }

    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .book-btn {
      width: 100%;
      padding: 0.8rem;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    .book-btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    /* Availability indicator */
    .avail-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: bold;
      margin-top: 0.4rem;
    }

    .avail-yes { background: #22c55e22; color: #22c55e; }
    .avail-no  { background: #ef444422; color: #ef4444; }

    /* My bookings */
    .booking-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid #1e293b;
      font-size: 0.8rem;
    }

    .booking-row:last-child { border: none; }

    .b-status {
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: bold;
      flex-shrink: 0;
    }

    .bs-pending   { background: #f59e0b22; color: #f59e0b; }
    .bs-confirmed { background: #22c55e22; color: #22c55e; }
    .bs-rejected  { background: #ef444422; color: #ef4444; }
    .bs-cancelled { background: #94a3b822; color: #94a3b8; }
  </style>
</head>
<body>

  <nav id="navbar"></nav>

  <div class="services-main">

    <div style="margin-bottom:1.5rem;">
      <h2>💼 Citizen Services</h2>
      <p style="color:#64748b; font-size:0.85rem; margin-top:0.2rem;">
        Jobs · Colleges · Hall Booking — all in one place
      </p>
    </div>

    <!-- Tab bar -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="setTab('jobs')">
        💼 Job Portal
      </button>
      <button class="tab-btn" onclick="setTab('colleges')">
        🎓 Colleges
      </button>
      <button class="tab-btn" onclick="setTab('halls')">
        🏛️ Hall Booking
      </button>
      <button class="tab-btn" onclick="setTab('mybookings')">
        📋 My Bookings
      </button>
    </div>

    <!-- ── JOBS PANEL ── -->
    <div id="panel-jobs">
      <div class="search-bar">
        <input type="text" id="job-search"
          placeholder="🔍 Search jobs, skills, company..."
          oninput="loadJobs()" />
        <select id="job-type" onchange="loadJobs()">
          <option value="">All Types</option>
          <option value="government">🏛️ Government</option>
          <option value="full-time">💼 Full-time</option>
          <option value="internship">🎓 Internship</option>
          <option value="part-time">⏰ Part-time</option>
          <option value="contract">📄 Contract</option>
        </select>
        <select id="job-sector" onchange="loadJobs()">
          <option value="">All Sectors</option>
          <option value="Technology">💻 Technology</option>
          <option value="Healthcare">🏥 Healthcare</option>
          <option value="Education">📚 Education</option>
          <option value="Infrastructure">🏗️ Infrastructure</option>
          <option value="Utilities">⚡ Utilities</option>
        </select>
      </div>

      <div id="jobs-stats"
        style="font-size:0.78rem; color:#64748b; margin-bottom:1rem;">
      </div>

      <div class="jobs-grid" id="jobs-grid">
        <p style="color:#64748b;">Loading jobs...</p>
      </div>
    </div>

    <!-- ── COLLEGES PANEL ── -->
    <div id="panel-colleges" style="display:none;">
      <div class="search-bar">
        <input type="text" id="college-search"
          placeholder="🔍 Search colleges or courses..."
          oninput="loadColleges()" />
        <select id="college-type" onchange="loadColleges()">
          <option value="">All Types</option>
          <option value="Medical">🏥 Medical</option>
          <option value="Engineering">⚙️ Engineering</option>
          <option value="Arts & Science">📚 Arts & Science</option>
          <option value="Polytechnic">🔧 Polytechnic</option>
          <option value="Law">⚖️ Law</option>
        </select>
      </div>
      <div class="college-grid" id="college-grid">
        <p style="color:#64748b;">Loading...</p>
      </div>
    </div>

    <!-- ── HALLS PANEL ── -->
    <div id="panel-halls" style="display:none;">
      <div class="halls-layout">

        <!-- Hall list -->
        <div>
          <h3 style="margin-bottom:1rem; font-size:1rem;">
            🏛️ Available Halls
          </h3>
          <div id="halls-list">
            <p style="color:#64748b;">Loading halls...</p>
          </div>
        </div>

        <!-- Booking form -->
        <div class="booking-form">
          <h4>📅 Book a Hall</h4>

          <div style="background:#0f172a; border-radius:8px;
                      padding:0.6rem 0.8rem; margin-bottom:1rem;
                      font-size:0.78rem; color:#94a3b8;">
            Selected: <b id="selected-hall-name"
              style="color:#38bdf8;">None</b>
          </div>

          <div class="form-field">
            <label>Event Name *</label>
            <input type="text" id="ev-name"
              placeholder="e.g. Annual Day Function" />
          </div>

          <div class="form-field">
            <label>Event Type</label>
            <select id="ev-type">
              <option value="cultural">🎭 Cultural</option>
              <option value="wedding">💍 Wedding</option>
              <option value="conference">💼 Conference</option>
              <option value="sports">🏃 Sports</option>
              <option value="government">🏛️ Government</option>
              <option value="other">📦 Other</option>
            </select>
          </div>

          <div class="form-field">
            <label>Date *</label>
            <input type="date" id="ev-date"
              onchange="checkAvailability()" />
          </div>

          <div id="avail-status"></div>

          <div style="display:grid; grid-template-columns:1fr 1fr;
                      gap:0.5rem;">
            <div class="form-field">
              <label>Start Time</label>
              <input type="time" id="ev-start" value="09:00" />
            </div>
            <div class="form-field">
              <label>End Time</label>
              <input type="time" id="ev-end" value="18:00" />
            </div>
          </div>

          <div class="form-field">
            <label>Expected Attendees</label>
            <input type="number" id="ev-attendees"
              placeholder="e.g. 200" min="1" />
          </div>

          <div class="form-field">
            <label>Notes (optional)</label>
            <textarea id="ev-notes" rows="2"
              placeholder="Special requirements..."></textarea>
          </div>

          <button class="book-btn" id="book-btn"
            onclick="submitBooking()">
            📅 Submit Booking Request
          </button>

          <div id="booking-result" style="margin-top:0.8rem;"></div>
        </div>

      </div>
    </div>

    <!-- ── MY BOOKINGS PANEL ── -->
    <div id="panel-mybookings" style="display:none;">
      <h3 style="margin-bottom:1.2rem;">📋 My Booking History</h3>
      <div id="my-bookings-list">
        <p style="color:#64748b;">Loading your bookings...</p>
      </div>
    </div>

  </div>

  <script src="../js/app.js"></script>
  <script src="../js/services.js"></script>
</body>
</html>
