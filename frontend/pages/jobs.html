<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Ballari — Job Portal</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .jobs-main { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem; }

    .search-bar {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .search-bar input,
    .search-bar select {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .search-bar input { flex: 1; min-width: 200px; }
    .search-bar input:focus,
    .search-bar select:focus { outline: none; border-color: #38bdf8; }

    .jobs-grid { display: flex; flex-direction: column; gap: 0.8rem; }

    .job-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      border: 1px solid #334155;
      transition: border-color 0.2s;
    }
    .job-card:hover { border-color: #38bdf8; }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .job-title  { font-size: 1rem; font-weight: bold; }
    .job-company { color: #38bdf8; font-size: 0.85rem; }

    .job-type-badge {
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: bold;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .type-government { background: #22c55e22; color: #22c55e; }
    .type-fulltime   { background: #38bdf822; color: #38bdf8; }
    .type-internship { background: #a78bfa22; color: #a78bfa; }
    .type-parttime   { background: #f59e0b22; color: #f59e0b; }
    .type-contract   { background: #94a3b822; color: #94a3b8; }

    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 0.6rem;
    }
    .job-desc {
      color: #94a3b8;
      font-size: 0.82rem;
      line-height: 1.5;
      margin-bottom: 0.6rem;
    }
    .skills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 0.7rem;
    }
    .skill-tag {
      background: #0f172a;
      border: 1px solid #334155;
      color: #cbd5e1;
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      font-size: 0.72rem;
    }
    .job-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .apply-btn {
      padding: 0.4rem 1rem;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <nav id="navbar"></nav>

  <div class="jobs-main">
    <div style="margin-bottom:1.5rem;">
      <h2>💼 Job Portal</h2>
      <p style="color:#64748b; font-size:0.85rem; margin-top:0.2rem;">
        Government and private job listings for Ballari
      </p>
    </div>

    <div class="search-bar">
      <input type="text" id="job-search"
        placeholder="🔍 Search jobs, skills, company..."
        oninput="loadJobs()" />
      <select id="job-type" onchange="loadJobs()">
        <option value="">All Types</option>
        <option value="government">🏛️ Government</option>
        <option value="full-time">💼 Full-time</option>
        <option value="internship">🎓 Internship</option>
        <option value="part-time">⏰ Part-time</option>
        <option value="contract">📄 Contract</option>
      </select>
      <select id="job-sector" onchange="loadJobs()">
        <option value="">All Sectors</option>
        <option value="Technology">💻 Technology</option>
        <option value="Healthcare">🏥 Healthcare</option>
        <option value="Education">📚 Education</option>
        <option value="Infrastructure">🏗️ Infrastructure</option>
        <option value="Utilities">⚡ Utilities</option>
      </select>
    </div>

    <div id="jobs-stats" style="font-size:0.78rem; color:#64748b; margin-bottom:1rem;"></div>

    <div class="jobs-grid" id="jobs-grid">
      <p style="color:#64748b;">Loading jobs...</p>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/jobs.js"></script>
</body>
</html>
