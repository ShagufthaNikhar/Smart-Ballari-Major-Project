<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Ballari — My Issues</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .issues-main {
      max-width: 780px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    .issues-header { margin-bottom: 1.5rem; }
    .issues-header h2 { color: #38bdf8; margin-bottom: 0.3rem; }
    .issues-header p { color: #94a3b8; font-size: 0.88rem; }

    .issue-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 1.3rem 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }
    .issue-thumb {
      width: 80px;
      height: 80px;
      border-radius: 10px;
      object-fit: cover;
      background: #0f172a;
      flex-shrink: 0;
      border: 1px solid #334155;
    }
    .issue-body { flex: 1; min-width: 0; }
    .issue-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.6rem;
      margin-bottom: 0.3rem;
    }
    .issue-title {
      font-size: 1rem;
      font-weight: 600;
      color: #f1f5f9;
      margin: 0;
    }
    .issue-gid {
      font-size: 0.75rem;
      color: #38bdf8;
      font-weight: bold;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .issue-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin: 0.4rem 0;
      font-size: 0.78rem;
      color: #64748b;
    }
    .issue-cat {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      color: #94a3b8;
    }
    .issue-date { color: #64748b; }
    .issue-status {
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: bold;
      text-transform: capitalize;
    }
    .status-open        { background: rgba(56,189,248,0.15); color: #38bdf8; }
    .status-pending      { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .status-in-progress  { background: rgba(168,85,247,0.15); color: #a855f7; }
    .status-resolved     { background: rgba(34,197,94,0.15); color: #22c55e; }

    .issue-desc {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-top: 0.2rem;
      line-height: 1.4;
    }

    .empty-state, .loading-state, .error-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #64748b;
    }
    .empty-state a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      background: #38bdf8;
      color: #0f172a;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    .error-state { color: #ef4444; }
  </style>
</head>
<body>

  <nav id="navbar"></nav>

  <div class="issues-main">
    <div class="issues-header">
      <h2>📋 My Reported Issues</h2>
      <p>Every issue you've reported, with its status and Grievance ID.</p>
    </div>

    <div id="issues-list">
      <div class="loading-state">⏳ Loading your issues...</div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script type="module" src="../js/my-issues.js"></script>
</body>
</html>
