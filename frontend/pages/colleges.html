<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Ballari — Colleges</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .colleges-main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    .search-bar {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .search-bar input,
    .search-bar select {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .search-bar input { flex: 1; min-width: 200px; }
    .search-bar input:focus,
    .search-bar select:focus { outline: none; border-color: #38bdf8; }

    .college-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .college-card {
      background: #1e293b;
      border-radius: 14px;
      border: 1px solid #334155;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .college-card:hover { border-color: #38bdf8; }

    .college-header {
      padding: 1.2rem;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid #334155;
    }
    .college-icon { font-size: 2.5rem; }
    .college-name {
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 0.2rem;
      line-height: 1.3;
    }
    .college-type {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: bold;
      background: #38bdf822;
      color: #38bdf8;
    }
    .college-body { padding: 1rem; }
    .college-detail {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 0.35rem;
    }
    .courses-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin: 0.6rem 0;
    }
    .course-tag {
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      font-size: 0.68rem;
    }
    .college-ranking {
      background: #f59e0b11;
      border: 1px solid #f59e0b44;
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      font-size: 0.72rem;
      color: #fbbf24;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <nav id="navbar"></nav>

  <div class="colleges-main">
    <div style="margin-bottom:1.5rem;">
      <h2>🎓 Colleges</h2>
      <p style="color:#64748b; font-size:0.85rem; margin-top:0.2rem;">
        Educational institutions in and around Ballari
      </p>
    </div>

    <div class="search-bar">
      <input type="text" id="college-search"
        placeholder="🔍 Search colleges or courses..."
        oninput="loadColleges()" />
      <select id="college-type" onchange="loadColleges()">
        <option value="">All Types</option>
        <option value="Medical">🏥 Medical</option>
        <option value="Engineering">⚙️ Engineering</option>
        <option value="Arts & Science">📚 Arts & Science</option>
        <option value="Polytechnic">🔧 Polytechnic</option>
        <option value="Law">⚖️ Law</option>
      </select>
    </div>

    <div class="college-grid" id="college-grid">
      <p style="color:#64748b;">Loading...</p>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/colleges.js"></script>
</body>
</html>
