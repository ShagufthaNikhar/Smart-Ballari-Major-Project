<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Ballari — Alerts</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .alerts-main {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .alerts-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .alerts-header h2 { color: #f1f5f9; }

    /* ── SUMMARY PILLS ── */
    .summary-row {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .summary-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid #334155;
      background: #1e293b;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.2s;
    }

    .summary-pill.active { border-color: var(--pill-color); color: var(--pill-color); }
    .summary-pill .count {
      background: var(--pill-color);
      color: #0f172a;
      border-radius: 999px;
      padding: 0.1rem 0.5rem;
      font-size: 0.75rem;
    }

    /* ── CREATE ALERT (admin only) ── */
    .create-alert-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 1.4rem;
      margin-bottom: 1.6rem;
      display: none; /* shown only when role === 'admin' */
    }
    .create-alert-card h4 {
      color: #38bdf8;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1rem;
    }
    .ca-row {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 0.7rem;
      flex-wrap: wrap;
    }
    .ca-row select,
    .ca-row input,
    .ca-row textarea {
      flex: 1;
      min-width: 140px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 0.6rem 0.7rem;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      font-family: inherit;
    }
    .ca-row select:focus,
    .ca-row input:focus,
    .ca-row textarea:focus { border-color: #38bdf8; }
    .ca-row textarea { resize: vertical; min-height: 60px; width: 100%; }

    .ca-submit {
      padding: 0.65rem 1.2rem;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .ca-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .ca-status {
      margin-top: 0.6rem;
      font-size: 0.78rem;
    }
    .ca-status.success { color: #22c55e; }
    .ca-status.error    { color: #ef4444; }

    /* ── ALERT LIST (notice board) ── */
    .alert-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .alert-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      border-left: 4px solid #334155;
      transition: border-color 0.2s;
      position: relative;
    }

    .alert-card.info     { border-left-color: #38bdf8; }
    .alert-card.warning  { border-left-color: #f59e0b; }
    .alert-card.critical {
      border-left-color: #ef4444;
      animation: alertPulse 3s infinite;
    }

    @keyframes alertPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
      50%      { box-shadow: 0 0 0 6px rgba(239,68,68,0.1); }
    }

    .alert-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
      gap: 0.5rem;
    }

    .alert-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #f1f5f9;
      flex: 1;
    }

    .alert-sev {
      font-size: 0.72rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-weight: bold;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .sev-info     { background: #38bdf822; color: #38bdf8; }
    .sev-warning  { background: #f59e0b22; color: #f59e0b; }
    .sev-critical { background: #ef444422; color: #ef4444; }

    .alert-msg {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 0.6rem;
    }

    .alert-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #475569;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .resolve-btn {
      padding: 0.25rem 0.7rem;
      background: #334155;
      color: #94a3b8;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .resolve-btn:hover { background: #22c55e; color: #0f172a; }

    .no-alerts {
      text-align: center;
      padding: 3rem;
      color: #22c55e;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .no-alerts .icon { font-size: 3rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body>

  <nav id="navbar"></nav>

  <div class="alerts-main">

    <div class="alerts-header">
      <h2>📢 Alerts</h2>
      <button onclick="refreshAlerts()"
        style="padding:0.5rem 1rem; background:#1e293b;
               border:1px solid #334155; color:#38bdf8;
               border-radius:8px; cursor:pointer; font-size:0.82rem;">
        🔄 Refresh
      </button>
    </div>

    <!-- Summary pills -->
    <div class="summary-row" id="summary-row">
      <div class="summary-pill active"
        style="--pill-color:#94a3b8"
        onclick="filterAlerts('')">
        📋 All <span class="count" id="cnt-total">0</span>
      </div>
      <div class="summary-pill"
        style="--pill-color:#ef4444"
        onclick="filterAlerts('critical')">
        🔴 Critical <span class="count" id="cnt-critical">0</span>
      </div>
      <div class="summary-pill"
        style="--pill-color:#f59e0b"
        onclick="filterAlerts('warning')">
        🟡 Warning <span class="count" id="cnt-warning">0</span>
      </div>
      <div class="summary-pill"
        style="--pill-color:#38bdf8"
        onclick="filterAlerts('info')">
        🔵 Info <span class="count" id="cnt-info">0</span>
      </div>
    </div>

    <!-- Create alert — admin only, shown/hidden by JS based on role -->
    <div class="create-alert-card" id="create-alert-card">
      <h4>📝 Post a New Alert</h4>
      <div class="ca-row">
        <select id="ca-type">
          <option value="water">💧 Water</option>
          <option value="traffic">🚦 Traffic</option>
          <option value="power">⚡ Power</option>
          <option value="sanitation">🗑️ Sanitation</option>
          <option value="crowd">👥 Crowd</option>
          <option value="surge">📈 Surge</option>
        </select>
        <select id="ca-severity">
          <option value="info">🔵 Info</option>
          <option value="warning" selected>🟡 Warning</option>
          <option value="critical">🔴 Critical</option>
        </select>
      </div>
      <div class="ca-row">
        <input type="text" id="ca-title" placeholder="Alert title" maxlength="120" />
      </div>
      <div class="ca-row">
        <input type="text" id="ca-area" placeholder="Area (optional, e.g. Cantonment)" maxlength="80" />
      </div>
      <div class="ca-row">
        <textarea id="ca-message" placeholder="Alert message" maxlength="500"></textarea>
      </div>
      <button class="ca-submit" id="ca-submit-btn" onclick="submitAlert()">
        Post Alert
      </button>
      <div class="ca-status" id="ca-status"></div>
    </div>

    <!-- Alert list -->
    <div class="alert-list" id="alert-list">
      <p style="color:#64748b; text-align:center; padding:2rem;">
        Loading alerts...
      </p>
    </div>

  </div>

  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/alerts.js"></script>
</body>
</html>
