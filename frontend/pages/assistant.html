<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Ballari — AI Assistant</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .assistant-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      height: calc(100vh - 60px);
    }

    @media (max-width: 900px) {
      .assistant-layout {
        grid-template-columns: 1fr;
      }
      .assistant-map-panel { display: none; }
    }

    /* ── CHAT PANEL ── */
    .chat-panel {
      display: flex;
      flex-direction: column;
      background: #0f172a;
      border-right: 1px solid #1e293b;
    }

    /* Chat header */
    .chat-header {
      padding: 1rem 1.2rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .assistant-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .assistant-info h4 {
      color: #f1f5f9;
      font-size: 0.9rem;
      margin-bottom: 0.1rem;
    }

    .assistant-info p {
      color: #64748b;
      font-size: 0.72rem;
    }

    .online-dot {
      width: 8px; height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-left: auto;
      animation: pulse 2s infinite;
    }

    /* Chat messages */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Message bubble */
    .msg {
      display: flex;
      gap: 0.7rem;
      max-width: 85%;
      animation: msgIn 0.3s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .msg-avatar.bot {
      background: linear-gradient(135deg, #38bdf822, #7c3aed22);
      border: 1px solid #334155;
    }

    .msg-avatar.user-av {
      background: #38bdf822;
      border: 1px solid #38bdf8;
    }

    .msg-bubble {
      background: #1e293b;
      border-radius: 14px;
      padding: 0.7rem 1rem;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #e2e8f0;
      border: 1px solid #334155;
    }

    .msg.user .msg-bubble {
      background: #38bdf822;
      border-color: #38bdf8;
      color: #f1f5f9;
    }

    /* Markdown-like formatting */
    .msg-bubble b  { color: #38bdf8; }
    .msg-bubble strong { color: #f59e0b; }

    /* Quick action buttons */
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }

    .quick-btn {
      padding: 0.3rem 0.7rem;
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .quick-btn:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Map mini-card in chat */
    .map-card {
      background: #0f172a;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 0.5rem;
      border: 1px solid #334155;
    }

    .map-card-header {
      padding: 0.4rem 0.7rem;
      font-size: 0.72rem;
      color: #64748b;
      border-bottom: 1px solid #1e293b;
    }

    .map-mini {
      height: 120px;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 0.7rem;
      align-items: center;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 0.6rem 0.8rem;
      background: #1e293b;
      border-radius: 14px;
      border: 1px solid #334155;
    }

    .typing-dot {
      width: 6px; height: 6px;
      background: #64748b;
      border-radius: 50%;
      animation: typingBounce 1.2s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%,80%,100% { transform: translateY(0);    opacity: 0.4; }
      40%          { transform: translateY(-6px); opacity: 1;   }
    }

    /* Suggestions */
    .suggestions-row {
      padding: 0.6rem 1rem;
      border-top: 1px solid #1e293b;
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      background: #0f172a;
    }

    .suggestion-chip {
      padding: 0.3rem 0.7rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 999px;
      font-size: 0.72rem;
      color: #94a3b8;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .suggestion-chip:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Chat input */
    .chat-input-wrap {
      padding: 0.8rem 1rem;
      border-top: 1px solid #334155;
      background: #1e293b;
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
    }

    .chat-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 42px;
      line-height: 1.5;
      font-family: inherit;
    }

    .chat-input:focus { border-color: #38bdf8; }

    .send-btn {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .send-btn:hover   { background: #0ea5e9; }
    .send-btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    .voice-btn {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .voice-btn.listening {
      border-color: #ef4444;
      color: #ef4444;
      animation: micPulse 1s infinite;
    }

    @keyframes micPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.3); }
      50%      { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
    }

    /* ── RIGHT MAP PANEL ── */
    .assistant-map-panel {
      display: flex;
      flex-direction: column;
      background: #0f172a;
    }

    .map-panel-header {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid #1e293b;
      font-size: 0.78rem;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #assistant-map {
      flex: 1;
      min-height: 300px;
    }

    /* Info below map */
    .map-info-panel {
      padding: 1rem;
      border-top: 1px solid #1e293b;
      max-height: 220px;
      overflow-y: auto;
    }

    .map-info-panel h5 {
      color: #38bdf8;
      font-size: 0.8rem;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid #1e293b;
      font-size: 0.8rem;
    }

    .info-item:last-child { border: none; }

    .info-icon { font-size: 1.1rem; flex-shrink: 0; }

    .info-name  { font-weight: 600; }
    .info-meta  { color: #64748b; font-size: 0.72rem; margin-top: 0.1rem; }
    .info-phone {
      color: #22c55e;
      font-size: 0.72rem;
      margin-top: 0.1rem;
    }

    /* Intent badge */
    .intent-badge {
      display: inline-block;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      font-size: 0.65rem;
      background: #7c3aed22;
      color: #a78bfa;
      margin-bottom: 0.3rem;
    }

    /* Scrollbar */
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <nav id="navbar"></nav>

  <div class="assistant-layout">

    <!-- Chat Panel -->
    <div class="chat-panel">

      <!-- Header -->
      <div class="chat-header">
        <div class="assistant-avatar">🤖</div>
        <div class="assistant-info">
          <h4>Smart Ballari Assistant</h4>
          <p>AI-powered city guide · Kannada & English</p>
        </div>
        <div class="online-dot"></div>
      </div>

      <!-- Messages -->
      <div class="chat-messages" id="chat-messages">
        <!-- Welcome message injected by JS -->
      </div>

      <!-- Suggestions -->
      <div class="suggestions-row" id="suggestions-row">
        <!-- Filled by JS -->
      </div>

      <!-- Input -->
      <div class="chat-input-wrap">
        <button class="voice-btn" id="voice-btn"
          onclick="toggleVoiceInput()"
          title="Voice input">🎙️</button>
        <textarea
          class="chat-input"
          id="chat-input"
          placeholder="Ask anything about Ballari..."
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)">
        </textarea>
        <button class="send-btn" id="send-btn"
          onclick="sendMessage()">➤</button>
      </div>

    </div>

    <!-- Right Map Panel -->
    <div class="assistant-map-panel">
      <div class="map-panel-header">
        <span>🗺️ Location Context</span>
        <span id="map-panel-label"
          style="color:#38bdf8; font-size:0.75rem;">
          Ballari, Karnataka
        </span>
      </div>
      <div id="assistant-map"></div>
      <div class="map-info-panel">
        <h5 id="map-info-title">📍 Nearby Services</h5>
        <div id="map-info-body">
          <p style="color:#64748b; font-size:0.82rem;">
            Ask about hospitals, police stations, or bus stops
            to see them here.
          </p>
        </div>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/assistant.js"></script>
</body>
</html>
